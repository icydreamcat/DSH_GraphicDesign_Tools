name: 平面设计 / KV · 海报 · 封面 · 信息设计
description: 面向平面设计的专职 Agent，从设计理解（唯一焦点、视线路径、层级秩序）到执行（栅格与尺度系统、字体排版、色彩系统、质感与调子），以「先意图后形式」为核心纪律。内建一套真实渲染引擎与测量工具链：参考图规格提取（把观感变成可执行数值）、调子与细节的空间分布分析、真实字体度量与溢出检测、四问自检（删减／焦点唯一性／去色层级／版面气质）、反模式硬约束校验，并可通过 Photoshop 交付分层 PSD。迭代走引擎（约 1 秒／稿），Photoshop 只用于最终分层交付。审美纪律常驻、能力按需调用，目标是让产出在**复杂度与细节**上成立，而不只是整体近似。
