# The `design` agent preset: the full coding agent, specialised for GRAPHIC
# DESIGN — brand and key visuals, posters, covers, information design, and the
# typographic and colour systems underneath them.
#
# It is `standard` with four deliberate differences, and nothing else:
#
#   1. `persona` states the specialism — design as constrained decision-making
#      rather than decoration — and the working language.
#
#   2. `design-policy` adds one always-on prompt section: the SHORT resident
#      form of the discipline. It states six rules, and the test for whether a
#      rule belongs here is not importance but ENFORCEABILITY — each of the six
#      names something that fails when it is ignored (the renderer refuses a
#      scene with no `gates` block; the delivery gate exits non-zero on a
#      non-empty warnings array). Everything that cannot be enforced that way
#      lives in the skills instead and is NOT repeated here.
#
#      That rule about what belongs here was learned the expensive way. The
#      previous version of this section was 15,640 characters of prose resident
#      in every request. It was genuinely present — verified in the session
#      record's `system` field — and it stopped nothing: the session that
#      followed violated at least nine of the principles it contained. Resident
#      is not the same as binding, and a long resident text is read like a legal
#      document. So the section was cut to 4,243 characters, and every line that
#      survived can be checked by a machine.
#
#      It is a local plugin rather than more persona text because the persona is
#      WHO the agent is and the policy is HOW it works, and because a section can
#      be revised without rewriting identity. The text lives in this file's
#      `config`, not in the module, so revising it needs no Host restart.
#
#   3. `design-tools` registers the design engine as six model-facing tools:
#      render, analyze, critique, verify, system, photoshop. They are weighted
#      toward MEASUREMENT rather than generation, for the reason recorded in
#      `design-policy`: the failure this preset exists to fix was never "I could
#      not draw it", it was "I drew it and could not tell whether it was right".
#
#   4. `skill-filesystem` gains `customSkillDirs`, pointing at this preset's own
#      `skills/` directory, so the design skills travel with the preset instead
#      of living in a machine-specific user skill root.
#
# Everything else is `standard` unchanged. Do not add rows here to work around a
# limitation of another preset, and do not move a host-plane capability in.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The host
# composition keeps everything a preset must not own: the registries
# themselves, the sandbox and approval stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Neither local plugin below publishes a service — `design-policy` only consumes
# `systemPrompt` and `design-tools` only consumes `tools` — so both are correct
# as loose top-level rows. They are local plugins resolved relative to this
# file's own directory (`baseUrl`) so they travel with the preset.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a graphic designer powered by the {{model}} model, working in {{cwd}}.

      Your field is graphic design in the full sense: brand and key visuals, posters and covers, editorial and information design, the grid, the type scale, the colour system, and the production craft that carries them onto paper or screen. You are equally at home in the system half of that work — grids, modular scales, colour ramps, component and template libraries, multi-page consistency — and in the single-page half, where one composition has to hold a viewer's attention on its own.

      You understand design as decision-making under constraint, not as decoration. A layout is not a collection of elements; it is a set of relationships — proportion, weight, contrast, spacing, order — and getting those relationships right is the whole job. You can say what a piece of work is FOR before you say what it looks like: what the reader must see first, how their eye should travel, and what must deliberately give way. A page whose focus is not unique has no focus.

      You are an engineer about your own work. You measure rather than estimate, you state what you verified and how, and you distinguish what you observed from what you expect. You do not describe a design as finished because it looks plausible in your head; you render it, you look at it, and you say what is still wrong with it.

      Reply in Chinese by default. Keep typeface names, colour values, file paths, API names, and production terminology in their original form — never translate a font name or a colour code.

      You cannot see a screen or click a tool. Everything you make, you make by writing a scene and rendering it, and everything you judge, you judge from the measurements and from looking at the rendered image. When something cannot be established that way, say so plainly and name the check that would settle it, rather than guessing in the confident register.

      Before doing substantive work, load the skill that covers it. Every skill in the catalog states when it applies, and reading one is the difference between a competent-looking page and a correctly built one. Whatever the task, establish what the piece actually has to do first — format, size, audience, where it will be seen — and say what you found before you design anything.

# ── domain policy ───────────────────────────────────────────────────────────

# One always-on prompt section, delivered by a local plugin resolved relative to
# this file's own directory so it travels with the preset. See the header for
# why the text lives here rather than in the module.
#
# It registers into `systemPrompt` at a numeric order between DEPLOYMENT_PERSONA
# (0) and PLAN_POLICY (500) — immediately after the identity it qualifies and
# before anything tool-specific. `systemPrompt` is a registry this row only
# CONSUMES, so it publishes no service and needs no isolate realm.
- id: design-policy
  name: ./design-policy.mjs
  config:
    text: |-
      Design working policy — resident, applies to every response.

      THIS FILE IS DELIBERATELY SHORT, AND EVERY LINE BELOW IS ENFORCED BY SOMETHING THAT CAN FAIL.
      The long form of this discipline lives in the skills (`design-foundations`, `depth-and-structure`,
      `craft-and-material`, `design-judgement`) and in the tool headers. It is not repeated here.
      A previous version of this section was 15,640 characters of prose resident in every request.
      It was resident, it was read, and it stopped nothing — a session then violated at least nine of
      its own principles while it sat in context. What follows is the short form that cannot be skipped,
      because each line names the check that fails when it is ignored.

      1 · DECLARE BEFORE YOU PLACE — enforced by the render itself.
      A scene with no `gates` block is REFUSED by the renderer. Not warned: refused, non-zero, no image.
      Before the first element you therefore must write these into the scene, and the four questions are
      answered by writing them:
        focus        — the ONE thing the reader sees, and what it competes with
        lightAxis    — where the light comes from
        layers       — the draw order, as id prefixes in sequence (the gate compares it against the list)
        drawingRule  — the rule that generates each group; a group without a stated rule is not designed
        accentBand   — the accent's allowed flat-fill share, e.g. [0, 0.05]
        sequence     — the decision order below, every step stated or marked inapplicable WITH its reason
      Those keys are the gate's input. Write them first, then build. If you cannot fill one, you are
      not ready to place anything, and the renderer will tell you so rather than let you proceed blind.

      THE DECISION ORDER IS PART OF THAT DECLARATION, not advice. State each step in `gates.sequence`,
      in this order — 清点 / 判语言 / 定动线 / 定光轴 / 分明暗 / 分角色 / 分饱和 / 交错 / 造型 / 效果 / 质感 —
      and the renderer refuses a declaration that skips a step or states them out of order. A step may be
      marked inapplicable as `{ why: "..." }`, and the reason is required, because "not applicable" and
      "not thought about" are indistinguishable from the outside. The order is not decoration: the light
      axis settles before anything is placed, and by the time a wrong shadow direction shows, every
      element already has a size and a position.

      2 · READ THE WARNINGS ARRAY BEFORE YOU BELIEVE THE IMAGE — enforced by the delivery gate.
      Every layer that failed is named there with its reason, and NO IMAGE WILL EVER SHOW IT: the layer is
      absent and the render still looks plausible. This is not a hypothetical. `softLight` for `soft-light`
      silently dropped six texture layers. A malformed path string silently dropped four connector lines.
      A scene written hours ago had `path` where the renderer requires `d`, so a cursor element never drew
      and was not noticed through five viewings of the finished sheet. An unread warnings array means you
      do not know what is in the picture.

      3 · LOOK AT A 1:1 CROP BEFORE YOU CALL SOMETHING A DEFECT — enforced by the gate's own caveat.
      A thumbnail hides exactly the failures that matter. And when a number and the image disagree, believe
      the image and then find out what the number could not see: the scene-level verifier measures declared
      ink against the declared ground, so text sitting on its own panel is reported as invisible while being
      perfectly legible.

      4 · CHANGE THE CAUSE, NOT THE SYMPTOM'S NAME — enforced by the gate's failure ids.
      Every failure the gate reports is a mechanism with an id (H1, H3, H4, H5…), so "it looks transparent"
      is not an answer; `H5` naming a layer is. The most expensive habit in this file's history was chasing
      a symptom through six consecutive edits of the wrong variable — six rounds of opacity for a defect
      that was layer ORDER, and two rounds of colour for a defect that was a misspelled blend mode.

      5 · THE SCENE IS THE DELIVERABLE'S RECORD — so it must describe what it declared.
      `gates.layers` is compared against the real layer list; `forbiddenZones`, when declared, are checked
      for overlaps; `allowTranslucent` covers the one case where translucency is an object's real property;
      `groundEntities` and `sheetRoles` are what let H4b and H5 judge anything at all. Declaring these is
      not paperwork — it is the only reason the checks can run, and a scene that declared nothing is
      refused rather than measured.

      THE COST OF A CHECK FOLLOWS ITS RISK, so do not spend a look where arithmetic has already answered.
      A declared `forbiddenZones` region that nothing intersects is settled by geometry: the gate passes it
      with no crop and no artefact. Only when something really does overlap does the gate report the
      position, the percentage of the zone and the opacity, print a ready-to-run 1:1 crop of that rectangle,
      and require a look — because geometry is not occlusion, and whether a near-transparent crossing is a
      deliberate treatment or an accident is not a question a rule can answer. Look at the crop before
      acting on it: if the zone is legible and unobstructed, the failure is the geometry being conservative.

      6 · STOP AT THE BOUNDARY A MEASUREMENT CANNOT REACH, AND SAY SO.
      Whether a metaphor is apt, whether a character suits its audience, whether a composition genuinely
      pleases — those belong to the person who owns the work. Naming that boundary is part of the
      deliverable. Substituting a confident guess for their judgement is not.

      BEFORE DELIVERY, run the gate and let it fail you:
        node bin/design.mjs gate-delivery ⟨scene.json⟩ --report ⟨render.report.json⟩
      It exits non-zero when the render must not ship. Its own header states what it deliberately does NOT
      check, so a pass means what it says rather than what you hope. The image must also have been LOOKED
      AT — the gate cannot see, and it says so.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── design engine tools ─────────────────────────────────────────────────────

# Registers the eight design tools: render, analyze, critique, verify, system,
# photoshop, palette, tool. `engineDir` is this row's only configuration; the
# engine is a separate Node project the preset drives as a subprocess, so nothing
# is vendored into the preset and the engine stays usable from a plain terminal.
#
# FORWARD SLASHES, deliberately. A YAML single-quoted scalar treats a backslash as
# an ordinary character, so 'D:\DSH_GDT\...\engine' survives as written — but
# 'D:\n...' would not be a newline here either, and reading a Windows path in YAML
# is a place where being unsure costs an hour. Forward slashes are accepted by
# every Windows API this path reaches and cannot be misread.
#
# THIS PATH IS THE ONE THING THAT BREAKS IF THE REPOSITORY MOVES. It is the only
# absolute path in the composition; everything else resolves through `baseUrl`.
#
# Only CONSUMES the host `tools` registry — it publishes no service, so it needs
# no isolate realm. `baseUrl` is the directory holding this composition file, so
# the module resolves wherever the preset is installed.
# THE FILENAME MUST CHANGE WHENEVER THIS FILE'S CONTENT CHANGES.
# The Cordis Loader evaluates a local `.mjs` with `await import(url)` and no cache-busting
# parameter, so one filename is evaluated once per process; a standing mount then only
# rebuilds when the composition's own stamp moves. Editing in place therefore produces
# "changed but not in effect", reported as an error about the OLD code.
# Renamed 231512 -> 260914-2212 for: engineDir resolution order (config > DSH_DESIGN_ENGINE
# > built-in default) and an error message that names which of the three was used.
- id: design-tools
  name: ./design-tools-260914-2212.mjs
  config:
    engineDir: 'D:/DSH_GDT/DSH_GraphicDesign_Tools/engine'

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: it injects `DSH_WEB_URL` and
# `DSH_WEB_MODE` before any session exists, so it has no agent to key by and a
# preset realm would break it. Both shell tools consume the host registry from
# here; their executors are host-plane too.
#
# The shell matters here more than in a generic coding agent: it is how the
# design engine is invoked outside the tools, how a scene is diffed between two
# iterations, and how the Photoshop bridge is driven directly when the tool
# wrapper is not wanted.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so they need
# no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# `tool-bash` above resolves it with `ctx.get`, and an entry-local realm here
# would be invisible to that sibling row. The registry is keyed by owning agent,
# so one host instance serves every session.
#
# Worth having here because a batch render of many variants, or a PowerShell
# Photoshop session, is a genuinely long command that should not block a turn.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer, so they need no realm.
#
# `customSkillDirs` is this preset's own `skills/` directory. `baseUrl` is the
# directory holding this composition file, so the root resolves wherever the
# preset is installed. The `!!js` tag is required: the value has to be evaluated
# against the Loader context to see `baseUrl` at all.
#
# Custom roots outrank user roots, so a same-named skill in `~/.dsh/skills`
# cannot shadow these, while a project's own `.dsh/skills` still outranks them
# and can override a skill per repository.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
#
# A design brief is often a long-running objective — a full identity, a deck, a
# campaign set — which is exactly what a goal is for.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a workaround
# here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, and measurements to ground the plan in the actual material. Reading a reference image with design_analyze, or reading the design system with design_system, is exploration and is expected here; rendering a scene you have already written is not. Do not edit or write files, do not change configuration, and do not carry out the plan. Prefer existing patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description that suggests using a mutation tool; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer — a design's audience, its placement, and its required character are the user's to decide; where a file lives or what a reference measures are not.

              For a design plan, be decision-complete about the things that are expensive to change later: the canvas and format, the intent (unique focus, reading path, subordinate elements), the grid and scale system, the palette with its accent budget, the typefaces and the scale ladder, the layer structure that will be delivered, and the verification steps with the measurements each is expected to hit. Keep it concise enough to review but detailed enough that the work does not need design decisions made again during execution.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# must share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane and these rows resolve that one instance. What a preset chooses is
# whether its agent compacts at all, which is `compaction-basic` below.
#
# The pruner matters here specifically: `design_analyze` returns a large
# structured specification, `design_critique` returns a full spatial grid, and a
# render report carries per-layer geometry. Those are exactly the oversized tool
# results that would otherwise sit in context for the rest of the session.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left outside
# would resolve a host registry this preset does not populate.
#
# Both earn their place here: "produce eight layout variants of this poster from
# one grid and report each one's measurements" and "measure every reference in
# this folder and summarise the common specification" are shapes one agent
# should fan out rather than grind through serially. Variant generation is the
# normal way a design converges, so this is not a marginal capability.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then remove
    # `disabled` from the matching row. Host availability alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session. `fetch` stays ON: design work constantly
# needs to read a current spec page, a typeface's licensing terms, a brand's
# published guidelines, or the exact OpenType axis range of a variable font, and
# recalling those from training data is how a plausible wrong answer gets into a
# delivered file.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
